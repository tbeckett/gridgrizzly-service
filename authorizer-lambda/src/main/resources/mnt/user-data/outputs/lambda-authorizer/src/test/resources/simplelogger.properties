# =============================================================================
# SLF4J SimpleLogger — Test Configuration
# src/test/resources/simplelogger.properties
#
# Overrides the production config during mvn test / mvn verify.
# Goals: readable test output, surface warnings and errors, suppress noise.
# =============================================================================

# WARN suppresses INFO-level output from the authorizer during normal test runs,
# keeping the Maven Surefire output clean. Failed tests produce enough context
# from assertion messages and stack traces without needing INFO logs alongside.
# Switch to INFO or DEBUG temporarily when diagnosing a failing test locally.
org.slf4j.simpleLogger.defaultLogLevel=WARN

# Suppress the Auth0 JWKS library entirely during tests. Tests use a mock
# key provider; any real JWKS output would only indicate a test isolation problem.
org.slf4j.simpleLogger.log.com.auth0=OFF

# Keep the authorizer package at WARN so unexpected warnings surface in CI output.
org.slf4j.simpleLogger.log.com.example.authorizer=WARN

# Omit timestamps in test output. Maven Surefire timestamps each test run;
# duplicate timestamps inside log lines add clutter without value.
org.slf4j.simpleLogger.showDateTime=false

# Keep level labels so WARN and ERROR lines are clearly identifiable.
org.slf4j.simpleLogger.levelInBrackets=true

# Keep the short class name for traceability when a warning does appear.
org.slf4j.simpleLogger.showShortLogName=true

# Omit thread names — unit tests are single-threaded.
org.slf4j.simpleLogger.showThreadName=false

# Write to System.out so Surefire captures output and includes it in
# test reports. Output only appears in the report for failing tests
# when using the default Surefire configuration.
org.slf4j.simpleLogger.logFile=System.out
