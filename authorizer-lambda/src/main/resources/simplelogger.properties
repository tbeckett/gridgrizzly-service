# =============================================================================
# SLF4J SimpleLogger — Production Configuration
# src/main/resources/simplelogger.properties
#
# Lambda writes all stdout/stderr to CloudWatch Logs automatically.
# This config controls what gets written and in what format.
# =============================================================================

# Minimum log level. INFO captures normal operation and all warnings/errors.
# Set to WARN in cost-sensitive environments to reduce CloudWatch ingestion volume.
org.slf4j.simpleLogger.defaultLogLevel=INFO

# Per-class overrides.
# The JWKS provider is noisy at DEBUG; keep it at WARN unless actively debugging
# key rotation or cache behaviour.
org.slf4j.simpleLogger.log.com.auth0=WARN
org.slf4j.simpleLogger.log.com.example.authorizer=INFO

# Include the timestamp in every log line.
# CloudWatch Logs adds its own timestamp on ingestion, but having it inline
# makes log lines self-contained when exported or queried via Logs Insights.
org.slf4j.simpleLogger.showDateTime=true

# ISO-8601 format. CloudWatch Logs Insights can parse this automatically
# when using the @timestamp field in queries.
org.slf4j.simpleLogger.dateTimeFormat=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'

# Include the log level label (INFO, WARN, ERROR) in every line.
org.slf4j.simpleLogger.levelInBrackets=true

# Include the short class name as the log source.
# Lambda log lines are already prefixed with the request ID by the runtime;
# adding the class name gives enough context without excessive verbosity.
org.slf4j.simpleLogger.showShortLogName=true

# Do not include the thread name. Lambda execution environments are
# single-threaded per invocation, so the thread name adds no useful context.
org.slf4j.simpleLogger.showThreadName=false

# Write to System.out. The Lambda runtime captures stdout to CloudWatch Logs.
# System.err is also captured but signals an error to the runtime — reserve
# it for unhandled exceptions, not structured log output.
org.slf4j.simpleLogger.logFile=System.out
